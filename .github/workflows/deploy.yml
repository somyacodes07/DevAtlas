name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'frontend/**'
      - 'reports/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker API
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Test Worker
        run: |
          npm run typecheck --workspace=@devatlas/worker
          npm run test --workspace=@devatlas/worker

      - name: Deploy Worker via Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          secrets: |
            MONGODB_URI
            ADMIN_API_KEY
            GITHUB_TOKEN
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}

      - name: Notify Skip if Secret Not Configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. Worker deployment step skipped gracefully."

  deploy-frontend:
    name: Deploy Cloudflare Pages (Next.js)
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Edge Intelligence Snapshots
        run: node scripts/sync-edge-data.mjs

      - name: Build Next.js Production Bundle
        run: npm run build --workspace=@devatlas/frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://devatlas-api.somyacodes.workers.dev/api/v1' }}

      - name: Check Cloudflare Pages per-file limit
        run: |
          node -e "const fs=require('node:fs'),path=require('node:path'),root='frontend/out',limit=25*1024*1024,oversized=[];function walk(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const file=path.join(dir,entry.name);if(entry.isDirectory())walk(file);else{const size=fs.statSync(file).size;if(size>limit)oversized.push({file,size});}}}walk(root);if(oversized.length){for(const item of oversized)console.error(item.file+': '+(item.size/1024/1024).toFixed(2)+' MiB');process.exit(1)}console.log('All exported assets are within the 25 MiB Cloudflare Pages limit.')"

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT || 'devatlas-web' }}

      - name: Notify Skip if Secret Not Configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. Pages deployment step skipped gracefully."

  smoke-test:
    name: Post-Deployment Smoke Verification
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Smoke Tests
        if: env.API_BASE_URL != ''
        run: npm run smoke-test

      - name: Notify Skip Smoke Test
        if: env.API_BASE_URL == ''
        run: echo "API_BASE_URL secret is not configured in GitHub Secrets. Post-deployment smoke test skipped gracefully."
