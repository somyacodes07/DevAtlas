name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/**'
      # Build inputs that live outside frontend/: dependency versions and the shared edition types.
      - 'package.json'
      - 'package-lock.json'
      - 'pipeline/src/types.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Check out the branch tip, not the triggering commit, so a deploy that
      # follows "Print edition" includes the edition that was just committed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://devatlas.pages.dev' }}

      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT || 'devatlas-web' }} --branch=main

      - name: Explain the skipped publish
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the site was built but not published."
