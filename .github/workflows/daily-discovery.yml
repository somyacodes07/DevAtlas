name: Developer Intelligence & Discovery Pipeline

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC to keep tech jobs, internships, and repos fresh
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      ai_provider:
        description: 'AI Enrichment Provider (deterministic, gemini, groq, openai)'
        required: false
        default: 'deterministic'
      force_publish:
        description: 'Force publish markdown reports and daily snapshots'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  discover:
    name: Ingestion, Scoring & Intelligence Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Pipeline Types
        run: npm run typecheck --workspace=@devatlas/pipeline

      - name: Execute Discovery & Normalization Pipeline
        run: npm run dev --workspace=@devatlas/pipeline
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: devatlas
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: ${{ inputs.ai_provider || secrets.AI_PROVIDER || 'gemini' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-20b' }}

      - name: Detect Meaningful Changes & Publish
        run: ./scripts/detect-meaningful-changes.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}

      - name: Trigger Edge Deployment
        if: success()
        run: |
          echo "[Deploy Trigger] Dispatching deploy.yml workflow to publish latest intelligence..."
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME:-main}" || echo "Workflow dispatch completed or skipped."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
