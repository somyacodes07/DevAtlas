name: Release

# Push a tag like v2.1.0 to cut a release: the code is tested again, the site
# and Worker are built, and both are attached to a GitHub release with an
# SBOM and generated notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          test "$want" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $want."; exit 1; }
      - name: Build the site and the Worker bundle
        run: |
          npm run build
          (cd api && npx wrangler deploy --dry-run --outdir ../dist/worker)
          tar -czf "devatlas-site-$GITHUB_REF_NAME.tar.gz" -C frontend/out .
          tar -czf "devatlas-api-$GITHUB_REF_NAME.tar.gz" -C dist/worker .
      - name: Generate the SBOM
        run: npx -y @cyclonedx/cyclonedx-npm --package-lock-only --ignore-npm-errors --output-file "devatlas-sbom-$GITHUB_REF_NAME.json"
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            devatlas-site-*.tar.gz
            devatlas-api-*.tar.gz
            devatlas-sbom-*.json
